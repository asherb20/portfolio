# Cache policy for Gatsby output. Hashed assets are immutable; HTML and
# page-data must always revalidate so new deploys show up immediately.
# Regexes are checked in order; the first match wins.
map $uri $cache_control {
    ~^/static/        "public, max-age=31536000, immutable";
    ~^/page-data/     "public, max-age=0, must-revalidate";
    ~\.html$          "public, max-age=0, must-revalidate";
    ~\.(js|css)$      "public, max-age=31536000, immutable";
    default           "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Emit relative Location headers so redirects don't leak :8080 or the pod
    # hostname when running behind an ingress / gateway.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/rss+xml application/manifest+json image/svg+xml;

    # Defined once at server level. Don't add `add_header` inside a location
    # block, or nginx drops all of these for that location.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS belongs on whatever terminates TLS (ingress/gateway), not here.

    # Liveness/readiness probe target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Redirects ported from netlify.toml.
    location ~ ^/about/?$                 { return 301 /#about; }
    location ~ ^/portfolio/?$             { return 301 /#projects; }
    location ~ ^/blog/?$                  { return 301 /#writing; }
    location ~ ^/(programming|music)/?$   { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
